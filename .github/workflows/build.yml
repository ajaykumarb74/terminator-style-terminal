name: build

on:
  push:
    branches: ["main", "feature/complete-term-project"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install X11 development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxpm-dev libxrender-dev libxft-dev libfontconfig1-dev
      - name: Build
        run: |
          make clean
          make
